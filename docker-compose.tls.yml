# HTTPS production override (self-signed OR Let's Encrypt).
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d --build
#
# Certificates must exist at ./certs/fullchain.pem and ./certs/privkey.pem
# before starting nginx — scripts/server-setup.sh handles this.
services:
  app:
    environment:
      # Mark session cookies Secure when served over HTTPS.
      COOKIE_SECURE: "1"

  nginx:
    read_only: false
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./certs:/etc/nginx/certs:ro
      - ./certbot/www:/var/www/certbot:ro
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    command: >
      /bin/sh -c "
      envsubst '$$DOMAIN'
      < /etc/nginx/templates/flightdeck-tls.conf.template
      > /etc/nginx/conf.d/default.conf &&
      nginx -g 'daemon off;'
      "
